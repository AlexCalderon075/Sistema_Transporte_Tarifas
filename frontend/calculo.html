<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Tarifas Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primario: #4e44ff; --oscuro: #2c3e50; --gris: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f3; padding: 20px; }
        .calc-container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 8px; color: var(--oscuro); font-size: 0.9rem; }
        input, select { padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primario); box-shadow: 0 0 8px rgba(78,68,255,0.2); }
        
        .btn-calcular { 
            background: var(--primario); color: white; border: none; padding: 15px; 
            width: 100%; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
        }

        .resultados { 
            margin-top: 30px; padding: 20px; background: var(--gris); border-radius: 10px;
            border-left: 5px solid var(--primario);
        }
        .res-fila { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #ddd; }
        .res-fila:last-child { border: none; font-size: 1.3rem; color: var(--primario); }
    </style>
</head>
<body>

<div class="calc-container">
    <h2 style="text-align: center; color: var(--primario);"><i class="fas fa-calculator"></i> Calculadora de Tarifas</h2>
    <hr style="opacity: 0.2; margin-bottom: 25px;">

    <div class="grid-inputs">
        <div class="form-group">
            <label>Kilómetros Totales</label>
            <input type="number" id="km" placeholder="Ej: 500" required>
        </div>
        <div class="form-group">
            <label>Días de Viaje</label>
            <input type="number" id="dias" value="1" required>
        </div>

        <div class="form-group">
            <label>Casetas ($)</label>
            <input type="number" id="casetas" value="0">
        </div>
        <div class="form-group">
            <label>Monto Transfer ($)</label>
            <input type="number" id="transfer" value="0">
        </div>
        <div class="form-group">
            <label>Diésel Thermo (Litros)</label>
            <input type="number" id="diesel_thermo" value="0">
        </div>

        <div class="form-group">
            <label>Tipo de Unidad</label>
            <select id="unidad">
                <option value="sencillo">Sencillo T3-S2</option>
                <option value="full">Full T3-S2-S2</option>
            </select>
        </div>
        <div class="form-group">
            <label>Tipo de Caja</label>
            <select id="caja">
                <option value="seca">Caja Seca</option>
                <option value="refrigerado">Refrigerado</option>
                <option value="plataforma">Plataforma</option>
            </select>
        </div>
    </div>

    <button class="btn-calcular" onclick="calcularTarifa()">
        GENERAR COTIZACIÓN
    </button>

    <div class="resultados">
        <div class="res-fila">
            <span>Pago Operador:</span>
            <span id="res_pago_operador">$0.00</span>
        </div>
        <div class="res-fila">
            <span>Costo Total Operativo:</span>
            <span id="res_costo_total">$0.00</span>
        </div>
        <div class="res-fila">
            <strong>Tarifa Sugerida (con Utilidad):</strong>
            <strong id="res_tarifa">$0.00</strong>
        </div>
    </div>
</div>

<script src="js/calculo.js"></script>
</body>
</html>
