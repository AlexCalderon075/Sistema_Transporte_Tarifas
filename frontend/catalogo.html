<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Tarifas - Sistema de Transporte</title>
    <link rel="stylesheet" href="css/style.css"> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .container { padding: 20px; max-width: 1200px; margin: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .btn-edit { background: #3498db; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 5% auto; padding: 20px; width: 40%; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-book"></i> Catálogo de Parámetros Operativos</h1>
        <p>Modifica los valores base para los cálculos de rutas.</p>
        
        <table id="tablaCatalogo">
            <thead>
                <tr>
                    <th>Configuración</th>
                    <th>Rendimiento (km/L)</th>
                    <th>Precio Diésel</th>
                    <th>Infraestructura</th>
                    <th>Sueldo Op.</th>
                    <th>Admin %</th>
                    <th>Utilidad %</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpoCatalogo">
                </tbody>
        </table>
        <br>
        <button onclick="location.href='dashboard.html'" class="btn-regresar">Volver al Dashboard</button>
    </div>

    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <h3>Editar Parámetros: <span id="nombreUnidad"></span></h3>
            <form id="formEditarTarifa">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>Rendimiento (KM/L):</label>
                    <input type="number" id="editRendimiento" step="0.1" required>
                </div>
                <div class="form-group">
                    <label>Precio Diésel:</label>
                    <input type="number" id="editDiesel" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Infraestructura (Casetas/Gastos):</label>
                    <input type="number" id="editInfra" required>
                </div>
                <div class="form-group">
                    <label>Administración (%):</label>
                    <input type="number" id="editAdmin" required>
                </div>
                <div class="form-group">
                    <label>Utilidad Deseada (%):</label>
                    <input type="number" id="editUtilidad" required>
                </div>
                <button type="submit" class="btn-guardar">Actualizar Catálogo</button>
                <button type="button" onclick="cerrarModal()" class="btn-cancelar">Cancelar</button>
            </form>
        </div>
    </div>

    <script src="js/catalogo.js"></script>
</body>
</html>
